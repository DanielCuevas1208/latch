name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: OTP ${{ matrix.otp }} / rebar3 ${{ matrix.rebar3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.0", "26.2.5"]
        rebar3: ["3.24.0"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Erlang and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Restore the dialyzer PLT cache
        uses: actions/cache@v5
        with:
          path: _build/default/*.plt
          key: plt-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
          restore-keys: |
            plt-${{ matrix.otp }}-

      - name: Compile with warnings as errors
        run: rebar3 compile

      - name: Run the EUnit test suite
        run: rebar3 eunit

      - name: Build the demo escript
        run: rebar3 escriptize

      - name: Run the pairwise demo
        run: ./_build/default/bin/latch pairwise --messages 4

      - name: Run the out-of-order demo
        run: ./_build/default/bin/latch shuffled --messages 6

      - name: Run the group demo
        run: ./_build/default/bin/latch group

      - name: Run dialyzer
        run: rebar3 dialyzer
